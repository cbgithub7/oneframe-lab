# Apple's Depth Pro. Its code is not on PyPI, so it comes from GitHub at a full commit, as a pinned
# source in runtime.json; this file lists what that code imports for inference (spec 005). Upstream
# pins numpy<2, which has no wheels for Python 3.14: spec 005's spike ran it on numpy 2. matplotlib,
# which only upstream's command line imports, is left out.
# Lock with `uv lock --project runtimes/depth_pro` (needs download.pytorch.org and pypi.org).
[project]
name = "oneframe-runtime-depth-pro"
version = "1"
description = "Oneframe Lab runtime: Apple's Depth Pro."
requires-python = "==3.14.*"
dependencies = ["timm==1.0.31", "numpy==2.5.4", "pillow==13.0.0", "pillow-heif==1.8.1"]

[project.optional-dependencies]
cu130 = ["torch==2.14.0", "torchvision==0.29.1"]
cu126 = ["torch==2.14.0", "torchvision==0.29.1"]
cpu = ["torch==2.14.0", "torchvision==0.29.1"]

[tool.uv]
package = false
# timm asks for torch with no version; held to the builds' own, so the lock holds no other.
constraint-dependencies = ["torch==2.14.0", "torchvision==0.29.1"]
conflicts = [[{ extra = "cu130" }, { extra = "cu126" }, { extra = "cpu" }]]
# The app runs on Windows; Linux is CI's second system.
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
