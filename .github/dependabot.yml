# Proposes an update the week a release lands. `npm run versions` fails once a release has waited
# 14 days without either an update or a written exception, so these pull requests get merged or
# answered rather than left.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # Node's types follow the Node the app runs on (docs/versions.md), so their major moves only
      # with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/engine"
    schedule:
      interval: weekly
    groups:
      engine:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
