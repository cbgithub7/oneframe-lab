name: checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the platform the app ships on; Linux catches what only a second OS shows.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the test guard compares with the base branch
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
      - name: Engine environment (exactly engine/uv.lock)
        run: uv sync --project engine --frozen
      - name: Engine checks (ruff, pyright, pytest)
        run: npm run engine:check
      - name: App dependencies (exactly package-lock.json)
        run: npm ci
      - name: App checks (eslint, tsc, node --test, docs)
        run: npm run check
      - name: No test removed without a reason in a spec
        run: node scripts/test-guard.js --base origin/${{ github.base_ref || 'main' }}

  versions:
    name: versions are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
      - run: npm run versions
