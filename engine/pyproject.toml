[project]
name = "oneframe-engine"
version = "0.1.0"
description = "Oneframe Lab's engine: node manifests, typed ports, the graph scheduler and its cache."
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "numpy>=2.3",
    "pillow>=12",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "pyright>=1.1.414",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv]
# The uv this project is tested with. Older ones are refused rather than trusted.
required-version = ">=0.12.20"

[tool.uv.build-backend]
module-name = "oneframe"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
