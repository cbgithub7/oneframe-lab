# Spec 005's spike: a throwaway environment for Apple's Depth Pro, not a runtime. Upstream is not on
# PyPI, so it comes from GitHub at a full commit. Upstream pins numpy<2, which has no wheels for
# Python 3.14, so the spike overrides it: whether Depth Pro runs on numpy 2 is one of its questions.
# Lock with `uv lock --project specs/005-first-models/spike/depth_pro`.
[project]
name = "oneframe-spike-depth-pro"
version = "0"
requires-python = "==3.14.*"
dependencies = [
  "depth_pro @ git+https://github.com/apple/ml-depth-pro.git@9e65e4dbe9568d23c546fcec53302b10445e109e",
  "numpy>=2",
  "pillow",
]

[project.optional-dependencies]
cu126 = ["torch==2.14.0", "torchvision==0.29.1"]
cpu = ["torch==2.14.0", "torchvision==0.29.1"]

[tool.uv]
package = false
override-dependencies = ["numpy>=2"]
conflicts = [[{ extra = "cu126" }, { extra = "cpu" }]]
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "cu126" }, { index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cu126", extra = "cu126" }, { index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
